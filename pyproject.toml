[project]
name = "infw"
version = "0.1.0"
description = "Parameter-free anytime optimization with interpolated normalized Frank-Wolfe"
readme = "README.md"
requires-python = ">=3.10"
# Intel macOS uses PyTorch 2.2, which requires NumPy 1.x interoperability.
dependencies = [
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
experiments = ["torch", "torchvision", "matplotlib", "tyro"]

[tool.uv]
package = false
# Keep the lock installable on Intel Macs with the selected Python version.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.11'"]
